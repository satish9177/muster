;  MUSTER agent-fleet import contracts.
;
;  Run with the kernel and the agents importable, and **not** the control
;  plane, because the rule this file exists for is the one that spans them:
;
;      PYTHONPATH="packages/muster-kernel/src;packages/muster-agents/src" \
;          lint-imports --config importlinter-agents.ini
;
;  (on a POSIX shell, separate the two paths with ``:`` instead of ``;``).
;
;  Three config files, three graphs, and the split is deliberate.  The kernel's
;  matrix is checked with only the kernel importable, so "the kernel imports no
;  database" is checked against a graph the platform is not in; the platform's
;  is checked with both of those; and this one is checked with the kernel and
;  the fleet, so "an agent cannot reach the control plane" is a fact about a
;  graph the control plane is absent from.
;
;  ``agent_tests/architecture`` checks an overlapping set of rules from a graph
;  it rebuilds with ``ast``.  Two independent implementations of one rule is
;  worth having; a defect in either tool's graph does not disable both.

[importlinter]
root_packages =
    muster
include_external_packages = True

;  **The rule the third distribution exists for.**
;
;  An agent runtime holds a model client and an agent framework.  A path from
;  it into the control plane would put those in reach of the process that holds
;  the case salt, the transcript and a database connection -- and would make
;  "an agent has no database access of any kind" a claim about discipline
;  rather than about a dependency graph.
;
;  The reverse rule lives in the platform's own file, and both are needed: this
;  one says an agent cannot reach the control plane, that one says the kernel
;  cannot, and neither implies the other.
[importlinter:contract:an-agent-never-sees-the-control-plane]
name = nothing in the agent fleet imports the control plane
type = forbidden
source_modules =
    muster.agents
forbidden_modules =
    muster.platform
allow_indirect_imports = True

;  **What an agent may see of the kernel.**
;
;  The wire contract and nothing above it.  An agent receives an assignment,
;  produces a relation, signs a payload and returns a response; it has never
;  heard of a policy bundle, a solver, a hinge, an admissibility descriptor or
;  a case revision, and every one of those is something it must not be able to
;  form an opinion about.
;
;  ``muster.policy`` in particular: a source that could read the pinned bundle
;  could read the rule its own answer feeds, which is the shortest path from
;  "interprets its own material" to "knows what answer would help".
[importlinter:contract:an-agent-sees-the-wire-contract-only]
name = the agent fleet imports the kernel wire seam only
type = forbidden
source_modules =
    muster.agents
forbidden_modules =
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.application
    muster.core.analysis
    muster.core.case
    muster.core.actions
    muster.core.catalog
allow_indirect_imports = True

;  **The model and the cloud, confined to the modules named for them.**
;
;  Everything above ``muster.agents.google`` and ``muster.agents.runtime`` is
;  written against ports, which is what lets the deterministic suite run the
;  real agent with no network at all.  A storage client outside
;  ``muster.agents.google`` would be a second place private material could be
;  read from; a model client outside the interpretation modules would be a
;  second place one could be called.
;
;  The exemptions are listed module by module rather than by wildcard, so a new
;  module reaching for either has to be added here in a diff somebody reviews.
[importlinter:contract:the-fleet-confines-its-cloud-and-model-clients]
name = the agent fleet reaches Google and cryptography only where it says it does
type = forbidden
;  Listed module by module rather than by wildcard, so a new module reaching for
;  either has to be added here in a diff somebody reviews.  The edges are stated
;  at the *root*, because that is the granularity the ban below is at.
ignore_imports =
    muster.agents.google.models -> google
    muster.agents.google.storage -> google
    muster.agents.profiles -> google
    muster.agents.runtime.agent -> google
    muster.agents.runtime.claimant -> google
    muster.agents.runtime.interpret -> google
    muster.agents.transport.identity -> google
    muster.agents.keys -> cryptography
source_modules =
    muster.agents
forbidden_modules =
    google
    cryptography
    fastapi
    starlette
    flask
    django
    sqlalchemy
    alembic
    psycopg
    psycopg2
    httpx
    requests
    aiohttp
    urllib3
    boto3
    grpc
    redis
    z3

;  **The worker agent has no path to an attestation.**
;
;  A claim and an attestation are different wire variants with different digest
;  kinds and different signing bodies, and the property that matters most in
;  this distribution is that the worker's runtime cannot reach the second.
;  It is enforced as an absence rather than as a flag: a single builder with a
;  ``claims_only`` boolean would make this a property of a branch, and a branch
;  is something a later edit gets wrong.
;
;  **This constrains the direct edge, and says so.**  An indirect path exists
;  and is harmless: the claim runtime imports the interpreter's limits, which
;  reach the shared wire seam, which reaches ``core.authority.scope`` -- a
;  coordinate type, not an authority.  What the worker agent cannot do is hold a
;  signer or construct a payload, and that is checked over the *types* by the
;  fleet's own architecture suite rather than over the module graph: the claim
;  agent has no signer field, and neither claim module names an acquisition
;  payload, a receipt or a preimage.
[importlinter:contract:the-claim-runtime-cannot-attest]
name = the worker claim runtime directly imports no signing or receipt path
type = forbidden
source_modules =
    muster.agents.runtime.claims
    muster.agents.runtime.claimant
forbidden_modules =
    muster.agents.runtime.receipts
    muster.agents.runtime.agent
    muster.agents.keys
    muster.core.authority
allow_indirect_imports = True

;  Identity is a question about the network and authority is a question about a
;  signed registry.  The transport may not reach the signing modules, and the
;  signing modules may not reach the transport: a component that could answer
;  both would be a component where one could be mistaken for the other.
[importlinter:contract:network-identity-and-source-authority-stay-apart]
name = the transport imports no signing path, and signing imports no transport
type = forbidden
source_modules =
    muster.agents.transport.identity
    muster.agents.transport.service
forbidden_modules =
    muster.agents.keys
    muster.agents.runtime.receipts
allow_indirect_imports = True
