;  MUSTER control-plane import contracts.
;
;  Run with BOTH distributions importable, which is the point -- the rule this
;  file exists for is the one that spans them:
;
;      PYTHONPATH="packages/muster-kernel/src;packages/muster-platform/src" \
;          lint-imports --config importlinter-platform.ini
;
;  (on a POSIX shell, separate the two paths with ``:`` instead of ``;``).
;
;  The kernel's own matrix is in ``importlinter.ini`` and is run with only the
;  kernel importable, so that "the kernel imports no database" is checked
;  against a graph the platform is not in.  Splitting the two files is
;  deliberate: one config that had to be correct under two different sets of
;  importable packages would end up exempting the driver everywhere.
;
;  ``tests/architecture`` in each package checks an overlapping set of rules
;  from a graph it rebuilds with ``ast``.  Two independent implementations of
;  one rule is worth having; a defect in either tool's graph does not disable
;  both.

[importlinter]
root_packages =
    muster
include_external_packages = True

;  The rule the whole design rests on. A kernel that could reach the control
;  plane could reach a database, a clock and a credential, and every claim
;  about the decision path being pure would become a claim about discipline.
[importlinter:contract:the-kernel-never-sees-the-platform]
name = nothing in the kernel imports the control plane
type = forbidden
source_modules =
    muster.core
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
forbidden_modules =
    muster.platform
allow_indirect_imports = True

;  The functional core. It reads kernel values and returns a decision; it does
;  not know that durable state exists, and it must not learn.
[importlinter:contract:orchestration-is-pure]
name = orchestration imports the kernel only
type = forbidden
source_modules =
    muster.platform.orchestration
forbidden_modules =
    muster.platform.casework
    muster.platform.ingest
    muster.platform.adapters
    muster.application
allow_indirect_imports = True

;  The imperative shell talks to protocols. Only a composition root -- which in
;  this milestone is a test, because there is no service yet -- names an adapter.
[importlinter:contract:the-shell-does-not-name-an-adapter]
name = casework and ingest import no adapter
type = forbidden
source_modules =
    muster.platform.casework
    muster.platform.ingest
forbidden_modules =
    muster.platform.adapters
allow_indirect_imports = True

;  Adapters implement the custody protocols. They have no business reaching up
;  into the commands written against them, and none into the pure core.
[importlinter:contract:adapters-implement-and-do-not-orchestrate]
name = adapters import the custody protocols only
type = forbidden
source_modules =
    muster.platform.adapters
forbidden_modules =
    muster.platform.casework.commands
    muster.platform.casework.advance
    muster.platform.casework.snapshot
    muster.platform.ingest
    muster.platform.orchestration
    muster.application
allow_indirect_imports = True

;  The one exemption in this file, listed module by module rather than by
;  wildcard: the SQL adapter is where a database driver is permitted to appear,
;  and any new module reaching for one has to be added here in a diff somebody
;  reviews. Everything else on the list is a component of a later milestone or
;  a dependency this distribution has decided not to have.
[importlinter:contract:the-control-plane-imports-no-cloud-web-model-or-broker]
name = the control plane imports no cloud, web, model, broker or solver package
type = forbidden
ignore_imports =
    muster.platform.adapters.sql.content -> psycopg
    muster.platform.adapters.sql.database -> psycopg
    muster.platform.adapters.sql.head -> psycopg
    muster.platform.adapters.sql.requests -> psycopg
    muster.platform.adapters.sql.schema -> psycopg
    muster.platform.adapters.sql.transcript -> psycopg
source_modules =
    muster.platform
forbidden_modules =
    fastapi
    starlette
    flask
    django
    sqlalchemy
    alembic
    pydantic
    httpx
    requests
    aiohttp
    urllib3
    google
    boto3
    grpc
    redis
    celery
    kombu
    kafka
    temporalio
    z3
    psycopg
