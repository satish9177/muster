;  MUSTER control-plane import contracts.
;
;  Run with BOTH distributions importable, which is the point -- the rule this
;  file exists for is the one that spans them:
;
;      PYTHONPATH="packages/muster-kernel/src;packages/muster-platform/src" \
;          lint-imports --config importlinter-platform.ini
;
;  (on a POSIX shell, separate the two paths with ``:`` instead of ``;``).
;
;  The kernel's own matrix is in ``importlinter.ini`` and is run with only the
;  kernel importable, so that "the kernel imports no database" is checked
;  against a graph the platform is not in.  Splitting the two files is
;  deliberate: one config that had to be correct under two different sets of
;  importable packages would end up exempting the driver everywhere.
;
;  ``tests/architecture`` in each package checks an overlapping set of rules
;  from a graph it rebuilds with ``ast``.  Two independent implementations of
;  one rule is worth having; a defect in either tool's graph does not disable
;  both.

[importlinter]
root_packages =
    muster
include_external_packages = True

;  The rule the whole design rests on. A kernel that could reach the control
;  plane could reach a database, a clock and a credential, and every claim
;  about the decision path being pure would become a claim about discipline.
[importlinter:contract:the-kernel-never-sees-the-platform]
name = nothing in the kernel imports the control plane
type = forbidden
source_modules =
    muster.core
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
forbidden_modules =
    muster.platform
allow_indirect_imports = True

;  The functional core. It reads kernel values and returns a decision; it does
;  not know that durable state exists, and it must not learn.
[importlinter:contract:orchestration-is-pure]
name = orchestration imports the kernel only
type = forbidden
source_modules =
    muster.platform.orchestration
forbidden_modules =
    muster.platform.casework
    muster.platform.ingest
    muster.platform.adapters
    muster.application
allow_indirect_imports = True

;  The imperative shell talks to protocols. Only a composition root -- which in
;  this milestone is a test, because there is no service yet -- names an adapter.
[importlinter:contract:the-shell-does-not-name-an-adapter]
name = casework and ingest import no adapter
type = forbidden
source_modules =
    muster.platform.casework
    muster.platform.ingest
forbidden_modules =
    muster.platform.adapters
allow_indirect_imports = True

;  Adapters implement the custody protocols. They have no business reaching up
;  into the commands written against them, and none into the pure core.
[importlinter:contract:adapters-implement-and-do-not-orchestrate]
name = adapters import the custody protocols only
type = forbidden
source_modules =
    muster.platform.adapters
forbidden_modules =
    muster.platform.casework.commands
    muster.platform.casework.advance
    muster.platform.casework.snapshot
    muster.platform.ingest
    muster.platform.orchestration
    muster.platform.disclose
    muster.application
allow_indirect_imports = True

;  The commitment core computes octets from values. It knows what was bound and
;  nothing about who may see it, which is what makes one audience's view
;  checkable against another's -- so it may not reach the policy interpreter,
;  the audience resolver or the view builder.
;
;  ``muster.platform.commit.publish`` is deliberately NOT a source here. It is
;  the imperative top of the package and it reaches ``disclose.policy`` on
;  purpose: a commitment refuses to pin a disclosure policy that could
;  over-disclose, so the validator runs before the envelope is signed. The rule
;  worth enforcing is that the pure half stays ignorant, not that the package
;  boundary is never crossed.
[importlinter:contract:the-commitment-core-knows-no-audience]
name = the pure commitment modules import no disclosure logic
type = forbidden
source_modules =
    muster.platform.commit.domains
    muster.platform.commit.paths
    muster.platform.commit.salts
    muster.platform.commit.envelope
    muster.platform.commit.record
    muster.platform.commit.tree
    muster.platform.commit.build
forbidden_modules =
    muster.platform.disclose
    muster.platform.casework
    muster.platform.adapters
allow_indirect_imports = True

;  **The milestone-E separation, as a rule a tool checks rather than a claim a
;  docstring makes.**  An authority decision must have no path to catalog data:
;  a catalog says which agents exist and where to send a request, and a
;  component that could consult it while deciding admissibility would be one an
;  agent could influence by publishing a profile.
;
;  The reverse direction is deliberately permitted.  Routing may reuse the
;  coordinate type and the publisher signing vocabulary, because knowing what a
;  grant looks like cannot confer one -- and forbidding it would buy a second
;  copy of ``ResourceScope`` and nothing else.
[importlinter:contract:authority-never-consults-the-catalog]
name = source authority imports no catalog, in the kernel or in the control plane
type = forbidden
source_modules =
    muster.core.authority
    muster.platform.authority
forbidden_modules =
    muster.core.catalog
    muster.platform.catalog
allow_indirect_imports = True

;  Routing produces an address.  A catalog module that reached the admission
;  path, the case head or an adapter would be a routing layer that had started
;  deciding things, and the next question would be which of its answers were
;  authority.
[importlinter:contract:the-catalog-routes-and-decides-nothing]
name = the fleet catalog imports no admission path, no adapter and no case state
type = forbidden
source_modules =
    muster.core.catalog
    muster.platform.catalog
forbidden_modules =
    muster.platform.adapters
    muster.platform.ingest
    muster.platform.casework.commands
    muster.platform.casework.advance
    muster.platform.casework.snapshot
    muster.admissibility
    muster.application
allow_indirect_imports = True

;  **The outbound edge, and the one package that names both sides.**
;
;  Dispatch resolves an address from the catalog and hands the reply to the
;  admission path, so it imports both -- which is exactly what nothing *inside*
;  either may do.  It is safe because it decides nothing with either: a route
;  is an address, and every receipt it submits is judged by check Q-12 against
;  the authority snapshot the case pinned, on the same path a receipt delivered
;  by any other means takes.
;
;  What it may not do is reach a driver or a disclosure view.  A dispatcher
;  that could open a connection would be a second custody layer, and one that
;  could read a participant view would be a component holding both the fleet
;  and the redacted record.
[importlinter:contract:dispatch-carries-and-decides-nothing]
name = dispatch imports no adapter, no disclosure and no commitment
type = forbidden
source_modules =
    muster.platform.dispatch
forbidden_modules =
    muster.platform.adapters
    muster.platform.disclose
    muster.platform.commit
    muster.platform.authority
allow_indirect_imports = True

;  Disclosure decides what a reader is shown. It reads a commitment; it never
;  reaches an adapter, and it never reaches the durable head except through the
;  snapshot and commitment functions written for it.
[importlinter:contract:disclosure-names-no-adapter]
name = disclosure imports no adapter
type = forbidden
source_modules =
    muster.platform.disclose
forbidden_modules =
    muster.platform.adapters
    muster.platform.ingest
    muster.application
allow_indirect_imports = True

;  The two exemptions in this file, listed module by module rather than by
;  wildcard: the SQL adapter is where a database driver is permitted to appear
;  and the crypto adapter is where a cryptography library is, and any new module
;  reaching for either has to be added here in a diff somebody reviews.
;  Everything else on the list is a component of a later milestone or a
;  dependency this distribution has decided not to have -- including a cloud key
;  management client, which the commitment ports exist precisely so as not to
;  need yet.
;  **The rule this milestone did not relax.**  An agent framework and a model
;  client are still absent, and the control plane's one outbound network edge
;  is written against the standard library precisely so that adding one would
;  have to be a deliberate diff here rather than a transitive dependency
;  somebody did not notice.  ``google`` stays on the list below.
[importlinter:contract:the-control-plane-imports-no-cloud-web-model-or-broker]
name = the control plane imports no cloud, web, model, broker or solver package
type = forbidden
ignore_imports =
    muster.platform.adapters.crypto -> cryptography
    muster.platform.adapters.sql.authority -> psycopg
    muster.platform.adapters.sql.commitments -> psycopg
    muster.platform.adapters.sql.config -> psycopg
    muster.platform.adapters.sql.content -> psycopg
    muster.platform.adapters.sql.database -> psycopg
    muster.platform.adapters.sql.executions -> psycopg
    muster.platform.adapters.sql.head -> psycopg
    muster.platform.adapters.sql.requests -> psycopg
    muster.platform.adapters.sql.schema -> psycopg
    muster.platform.adapters.sql.transcript -> psycopg
source_modules =
    muster.platform
forbidden_modules =
    fastapi
    starlette
    flask
    django
    sqlalchemy
    alembic
    pydantic
    httpx
    requests
    aiohttp
    urllib3
    google
    boto3
    grpc
    redis
    celery
    kombu
    kafka
    temporalio
    z3
    psycopg
    cryptography
