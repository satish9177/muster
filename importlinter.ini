;  MUSTER import contracts.
;
;  Run with:
;      PYTHONPATH=packages/muster-kernel/src lint-imports --config importlinter.ini
;
;  The file name is not one import-linter discovers, so the flag is not
;  optional: without it the tool reports "Could not read any configuration"
;  and exits non-zero having checked nothing.
;
;  The contracts below are the frozen dependency matrix, restricted to the
;  modules that exist today.  Modules the final architecture will contain but
;  Milestone A does not -- the Z3 adapter, the procurement domain, the platform
;  and agent distributions -- are deliberately absent: a contract naming a
;  module that does not exist proves nothing and rots.
;
;  Three rules live in tests/architecture instead, because expressing them here
;  would need a configuration trick rather than a contract:
;      * no production import of spec/reference-semantics
;      * the solver abstraction must not reach its own adapters
;      * every production module must be covered by at least one contract
;
;  The internal contracts describe DIRECT edges, which is what the frozen
;  "may import" matrix states.  ``evidence`` seeing a policy type through the
;  oracle it consumes is not a violation -- it is what "evidence may import
;  hinge" means.  Dependency *direction* and acyclicity are checked
;  independently in tests/architecture, over a graph rebuilt from the source.

[importlinter]
root_packages =
    muster
include_external_packages = True

[importlinter:contract:core-depends-on-nothing]
name = core imports nothing else in muster
type = forbidden
source_modules =
    muster.core
forbidden_modules =
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

;  ``muster.core.catalog`` appears in the forbidden list of every contract
;  below whose source package decides admissibility.  A routing record must not
;  be reachable from anything that decides whether evidence is admitted -- and
;  the ast-based matrix in ``tests/architecture`` states the same rule, because
;  a defect in either tool's graph must not disable both.  ``core.authority``
;  heads the list below because ``core/authority/check.py`` *is* Q-12: leaving
;  it out left the one seam that decides authorization enforced by the single
;  checker this contract exists to stop depending on.  The composition root
;  is deliberately exempt: routing is one of the things it composes.
;  The edge that matters most, stated here as well as in the ast matrix.
;
;  ``core.evidence`` is where relation validation calls Q-12, so "the module
;  that runs admission checks cannot see a routing record" is the single most
;  load-bearing instance of the authority/catalog separation -- and the
;  contracts below only cover the packages *above* core.  Without this one, that
;  edge was enforced by exactly one checker, and the two-independent-tools
;  property the ast matrix's docstring claims did not hold for it.
[importlinter:contract:the-deciding-core-sees-no-catalog]
name = the core seams that decide admissibility import no fleet catalog
type = forbidden
source_modules =
    muster.core.authority
    muster.core.evidence
    muster.core.case
    muster.core.actions
    muster.core.analysis
forbidden_modules =
    muster.core.catalog
allow_indirect_imports = True

[importlinter:contract:policy-sees-only-core]
name = policy imports core only
type = forbidden
source_modules =
    muster.policy
forbidden_modules =
    muster.core.catalog
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:solve-sees-only-core]
name = solve imports core only
type = forbidden
source_modules =
    muster.solve
forbidden_modules =
    muster.core.catalog
    muster.policy
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:admissibility-sees-core-and-policy]
name = admissibility imports core and policy only
type = forbidden
source_modules =
    muster.admissibility
forbidden_modules =
    muster.core.catalog
    muster.solve
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:hinge-sees-core-policy-and-the-solver-port]
name = hinge imports core, policy and the solver port only
type = forbidden
source_modules =
    muster.hinge
forbidden_modules =
    muster.core.catalog
    muster.admissibility
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:evidence-sees-core-and-hinge]
name = evidence imports core and hinge only
type = forbidden
source_modules =
    muster.evidence
forbidden_modules =
    muster.core.catalog
    muster.policy
    muster.solve
    muster.admissibility
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:domains-see-core-and-policy]
name = domains import core and policy only
type = forbidden
source_modules =
    muster.domains
forbidden_modules =
    muster.core.catalog
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.application
allow_indirect_imports = True

[importlinter:contract:only-the-composition-root-composes]
name = nothing below the composition root imports it
type = forbidden
source_modules =
    muster.core
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
forbidden_modules =
    muster.application
allow_indirect_imports = True

[importlinter:contract:no-cloud-web-or-database-anywhere]
name = the kernel imports no cloud, web, database, model or solver package
type = forbidden
;  The kernel's packages, enumerated rather than written as ``muster``.
;
;  ``muster`` is a namespace the control-plane distribution also lives in, and
;  that distribution imports a database driver by design.  Naming the namespace
;  here would make this contract's result depend on which distributions happen
;  to be importable, which is the opposite of what a contract is for: with both
;  installed it fails on a legitimate import, and the "fix" somebody reaches
;  for is to exempt the driver -- which would exempt it for the kernel too.
;
;  Enumerating instead makes the contract say what its name says.  The list is
;  checked against the tree by ``tests/architecture``: a new kernel package
;  that is not listed here fails, so this cannot silently stop covering
;  something.  The platform's own contracts live in ``importlinter-platform.ini``.
source_modules =
    muster.core
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
;  The single exemption in the whole tree, listed module by module rather than
;  by wildcard: the SMT adapter is where a solver library is permitted to
;  appear, and any new module reaching for one has to be added here in a diff
;  somebody reviews.  ``tests/architecture`` checks the same rule from its own
;  graph, so removing this exemption without removing the import fails twice.
ignore_imports =
    muster.solve.z3.backend -> z3
    muster.solve.z3.lowering -> z3
    muster.solve.z3.witness -> z3
forbidden_modules =
    z3
    fastapi
    starlette
    flask
    django
    sqlalchemy
    alembic
    psycopg
    psycopg2
    pydantic
    httpx
    requests
    aiohttp
    urllib3
    google
    boto3
    grpc
    redis
