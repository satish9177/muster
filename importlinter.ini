;  MUSTER import contracts.
;
;  Run with:
;      PYTHONPATH=packages/muster-kernel/src lint-imports --config importlinter.ini
;
;  The file name is not one import-linter discovers, so the flag is not
;  optional: without it the tool reports "Could not read any configuration"
;  and exits non-zero having checked nothing.
;
;  The contracts below are the frozen dependency matrix, restricted to the
;  modules that exist today.  Modules the final architecture will contain but
;  Milestone A does not -- the Z3 adapter, the procurement domain, the platform
;  and agent distributions -- are deliberately absent: a contract naming a
;  module that does not exist proves nothing and rots.
;
;  Three rules live in tests/architecture instead, because expressing them here
;  would need a configuration trick rather than a contract:
;      * no production import of spec/reference-semantics
;      * the solver abstraction must not reach its own adapters
;      * every production module must be covered by at least one contract
;
;  The internal contracts describe DIRECT edges, which is what the frozen
;  "may import" matrix states.  ``evidence`` seeing a policy type through the
;  oracle it consumes is not a violation -- it is what "evidence may import
;  hinge" means.  Dependency *direction* and acyclicity are checked
;  independently in tests/architecture, over a graph rebuilt from the source.

[importlinter]
root_packages =
    muster
include_external_packages = True

[importlinter:contract:core-depends-on-nothing]
name = core imports nothing else in muster
type = forbidden
source_modules =
    muster.core
forbidden_modules =
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:policy-sees-only-core]
name = policy imports core only
type = forbidden
source_modules =
    muster.policy
forbidden_modules =
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:solve-sees-only-core]
name = solve imports core only
type = forbidden
source_modules =
    muster.solve
forbidden_modules =
    muster.policy
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:admissibility-sees-core-and-policy]
name = admissibility imports core and policy only
type = forbidden
source_modules =
    muster.admissibility
forbidden_modules =
    muster.solve
    muster.hinge
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:hinge-sees-core-policy-and-the-solver-port]
name = hinge imports core, policy and the solver port only
type = forbidden
source_modules =
    muster.hinge
forbidden_modules =
    muster.admissibility
    muster.evidence
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:evidence-sees-core-and-hinge]
name = evidence imports core and hinge only
type = forbidden
source_modules =
    muster.evidence
forbidden_modules =
    muster.policy
    muster.solve
    muster.admissibility
    muster.domains
    muster.application
allow_indirect_imports = True

[importlinter:contract:domains-see-core-and-policy]
name = domains import core and policy only
type = forbidden
source_modules =
    muster.domains
forbidden_modules =
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.application
allow_indirect_imports = True

[importlinter:contract:only-the-composition-root-composes]
name = nothing below the composition root imports it
type = forbidden
source_modules =
    muster.core
    muster.policy
    muster.solve
    muster.admissibility
    muster.hinge
    muster.evidence
    muster.domains
forbidden_modules =
    muster.application
allow_indirect_imports = True

[importlinter:contract:no-cloud-web-or-database-anywhere]
name = the kernel imports no cloud, web, database, model or solver package
type = forbidden
source_modules =
    muster
;  The single exemption in the whole tree, listed module by module rather than
;  by wildcard: the SMT adapter is where a solver library is permitted to
;  appear, and any new module reaching for one has to be added here in a diff
;  somebody reviews.  ``tests/architecture`` checks the same rule from its own
;  graph, so removing this exemption without removing the import fails twice.
ignore_imports =
    muster.solve.z3.backend -> z3
    muster.solve.z3.lowering -> z3
    muster.solve.z3.witness -> z3
forbidden_modules =
    z3
    fastapi
    starlette
    flask
    django
    sqlalchemy
    alembic
    psycopg
    psycopg2
    pydantic
    httpx
    requests
    aiohttp
    urllib3
    google
    boto3
    grpc
    redis
